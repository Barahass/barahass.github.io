<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARAHASS GLOBAL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            color: #ffffff;
            /* Detailed SVG Background: Sky, Mountains, Irrigation, Trellises, and Lush Vines */
            background: 
                linear-gradient(to bottom, rgba(15, 23, 42, 0.35), rgba(15, 23, 42, 0.65)),

roke-width='8' stroke='%2378350f'/%3E%3Cline x1='0' y1='520' x2='1440' y2='520'/%3E%3Cline x1='0' y1='580' x2='1440' y2='580'/%3E%3Cline x1='0' y1='640' x2='1440' y2='640'/%3E%3C/g%3E%3C!-- Detailed Raspberry Bushes & Foliage --%3E%3Cg fill='%2315803d'%3E%3Ccircle cx='80' cy='560' r='55'/%3E%3Ccircle cx='130' cy='540' r='60' fill='%23166534'/%3E%3Ccircle cx='190' cy='570' r='50'/%3E%3Ccircle cx='250' cy='550' r='65' fill='%2314532d'/%3E%3Ccircle cx='320' cy='560' r='55'/%3E%3Ccircle cx='420' cy='540' r='60' fill='%2315803d'/%3E%3Ccircle cx='480' cy='560' r='70' fill='%23166534'/%3E%3Ccircle cx='560' cy='540' r='55'/%3E%3Ccircle cx='640' cy='560' r='65' fill='%2314532d'/%3E%3Ccircle cx='720' cy='550' r='55'/%3E%3Ccircle cx='820' cy='540' r='65' fill='%23166534'/%3E%3Ccircle cx='900' cy='560' r='60'/%3E%3Ccircle cx='980' cy='540' r='70' fill='%2314532d'/%3E%3Ccircle cx='1070' cy='560' r='55'/%3E%3Ccircle cx='1160' cy='540' r='65' fill='%2315803d'/%3E%3Ccircle cx='1240' cy='560' r='60' fill='%23166534'/%3E%3Ccircle cx='1330' cy='540' r='70'/%3E%3Ccircle cx='1400' cy='560' r='55' fill='%2314532d'/%3E%3C/g%3E%3C!-- Foreground Foliage Layer --%3E%3Cg fill='%2322c55e' opacity='0.9'%3E%3Ccircle cx='50' cy='590' r='45'/%3E%3Ccircle cx='160' cy='585' r='50'/%3E%3Ccircle cx='280' cy='595' r='45'/%3E%3Ccircle cx='390' cy='580' r='50'/%3E%3Ccircle cx='520' cy='590' r='55'/%3E%3Ccircle cx='680' cy='585' r='50'/%3E%3Ccircle cx='780' cy='595' r='45'/%3E%3Ccircle cx='930' cy='580' r='55'/%3E%3Ccircle cx='1020' cy='590' r='45'/%3E%3Ccircle cx='1120' cy='585' r='50'/%3E%3Ccircle cx='1280' cy='590' r='55'/%3E%3C/g%3E%3C!-- Hanging Raspberry Clusters --%3E%3Cg fill='%23e11d48'%3E%3C!-- Cluster 1 --%3E%3Ccircle cx='100' cy='600' r='9'/%3E%3Ccircle cx='112' cy='602' r='8' fill='%23be123c'/%3E%3Ccircle cx='106' cy='612' r='8.5' fill='%23e11d48'/%3E%3C!-- Cluster 2 --%3E%3Ccircle cx='220' cy='590' r='10' fill='%23be123c'/%3E%3Ccircle cx='232' cy='594' r='9'/%3E%3Ccircle cx='226' cy='604' r='9' fill='%239f1239'/%3E%3C!-- Cluster 3 --%3E%3Ccircle cx='430' cy='595' r='11'/%3E%3Ccircle cx='443' cy='598' r='9.5' fill='%23be123c'/%3E%3Ccircle cx='436' cy='610' r='10' fill='%23e11d48'/%3E%3C!-- Cluster 4 --%3E%3Ccircle cx='610' cy='605' r='9' fill='%23be123c'/%3E%3Ccircle cx='622' cy='608' r='8.5'/%3E%3Ccircle cx='616' cy='618' r='9' fill='%23e11d48'/%3E%3C!-- Cluster 5 --%3E%3Ccircle cx='850' cy='590' r='10'/%3E%3Ccircle cx='862' cy='593' r='9' fill='%23be123c'/%3E%3Ccircle cx='856' cy='603' r='9.5' fill='%239f1239'/%3E%3C!-- Cluster 6 --%3E%3Ccircle cx='1050' cy='600' r='11' fill='%23be123c'/%3E%3Ccircle cx='1063' cy='603' r='9.5'/%3E%3Ccircle cx='1056' cy='614' r='10' fill='%23e11d48'/%3E%3C!-- Cluster 7 --%3E%3Ccircle cx='1220' cy='595' r='9'/%3E%3Ccircle cx='1232' cy='598' r='8.5' fill='%23be123c'/%3E%3Ccircle cx='1226' cy='608' r='9' fill='%23e11d48'/%3E%3C/g%3E%3C/svg%3E");
            background-size: cover;
            background-position: center;
        }

        /* Hero Content Card */
        .container {
            max-width: 750px;
            margin: 60px auto 20px auto;
            padding: 40px 30px;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 2.75rem;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        h1 span {
            color: #f43f5e;
        }

        p {
            font-size: 1.15rem;
            line-height: 1.6;
            color: #e2e8f0;
            margin-bottom: 25px;
        }

        .badges {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(244, 63, 94, 0.2);
            border: 1px solid rgba(244, 63, 94, 0.4);
            color: #fecdd3;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Road & Transport Layer */
        .logistics-scene {
            width: 100%;
            position: relative;
            z-index: 1;
            margin-top: auto;
        }

        .road {
            width: 100%;
            height: 65px;
            background: #1e293b;
            border-top: 4px solid #475569;
            position: relative;
            overflow: hidden;
        }

        .road-line {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            height: 0;
            border-top: 4px dashed #cbd5e1;
        }

        .destination-tag {
            position: absolute;
            right: 20px;
            top: -35px;
            background: #16a34a;
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .truck-wrapper {
            position: absolute;
            bottom: 10px;
            left: -220px;
            animation: drive 14s linear infinite;
        }

        @keyframes drive {
            0% { left: -220px; }
            100% { left: 100%; }
        }

        .truck-svg {
            width: 190px;
            height: auto;
            filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.5));
        }

        /* Fixed Wheel Rotation Animation */
        .spoke-group {
            animation: spin 0.6s linear infinite;
            transform-origin: center;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>BARAHASS<span>GLOBAL</span>COMPANY</h1>
        <p>Built on Trust. Delivering Quality.</p>
        
        <div class="badges">
            <span class="badge">🌱 Farm Production</span>
            <span class="badge">🇲🇽 🇺🇸 Cross-Border Transport</span>
            <span class="badge">🏪 Direct Market Delivery</span>
        </div>
    </div>

    <!-- Logistics Animation Scene -->
    <div class="logistics-scene">
        <div class="destination-tag">🏪 International Produce Market</div>
        <div class="road">
            <div class="road-line"></div>
            
            <div class="truck-wrapper">
                <svg class="truck-svg" viewBox="0 0 220 85" xmlns="http://www.w3.org/2000/svg">
                    <!-- Refrigerated Cargo Container -->
                    <rect x="10" y="10" width="130" height="50" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
                    <line x1="140" y1="10" x2="140" y2="60" stroke="#94a3b8" stroke-width="2"/>
                    <line x1="50" y1="10" x2="50" y2="60" stroke="#e2e8f0" stroke-width="1.5"/>
                    <line x1="90" y1="10" x2="90" y2="60" stroke="#e2e8f0" stroke-width="1.5"/>
                    
                    <!-- Mexican Flag Decal (Left side of trailer) -->
                    <g transform="translate(20, 22)">
                        <rect x="0" y="0" width="8" height="16" fill="#006847"/>
                        <rect x="8" y="0" width="8" height="16" fill="#ffffff"/>
                        <rect x="16" y="0" width="8" height="16" fill="#ce1126"/>
                        <!-- Coat of arms dot -->
                        <circle cx="12" cy="8" r="1.5" fill="#a16207"/>
                        <!-- Border frame -->
                        <rect x="0" y="0" width="24" height="16" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
                    </g>

                    <!-- American Flag Decal (Right side of trailer) -->
                    <g transform="translate(58, 22)">
                        <!-- Red and White Stripes -->
                        <rect x="0" y="0" width="24" height="16" fill="#ffffff"/>
                        <rect x="0" y="0" width="24" height="2.3" fill="#b22234"/>
                        <rect x="0" y="4.6" width="24" height="2.3" fill="#b22234"/>
                        <rect x="0" y="9.2" width="24" height="2.3" fill="#b22234"/>
                        <rect x="0" y="13.7" width="24" height="2.3" fill="#b22234"/>
                        <!-- Blue Canton -->
                        <rect x="0" y="0" width="10" height="9.2" fill="#3c3b6e"/>
                        <!-- Border frame -->
                        <rect x="0" y="0" width="24" height="16" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
                    </g>
                    
                    <!-- Truck Cabin -->
                    <path d="M 145 25 L 175 25 L 195 44 L 195 60 L 145 60 Z" fill="#e11d48"/>
                    <!-- Cabin Window -->
                    <path d="M 155 30 L 172 30 L 185 44 L 155 44 Z" fill="#38bdf8" opacity="0.85"/>
                    <!-- Bumper & Chassis -->
                    <rect x="5" y="58" width="195" height="6" fill="#334155"/>
                    <rect x="193" y="52" width="6" height="10" fill="#94a3b8"/>
                    
                    <!-- Wheel 1 (Trailer Back) -->
                    <g transform="translate(35, 64)">
                        <circle cx="0" cy="0" r="11" fill="#0f172a"/>
                        <circle cx="0" cy="0" r="7" fill="#cbd5e1"/>
                        <g class="spoke-group">
                            <line x1="-6" y1="0" x2="6" y2="0" stroke="#334155" stroke-width="2"/>
                            <line x1="0" y1="-6" x2="0" y2="6" stroke="#334155" stroke-width="2"/>
                        </g>
                        <circle cx="0" cy="0" r="2.5" fill="#0f172a"/>
                    </g>

                    <!-- Wheel 2 (Trailer Mid/Front) -->
                    <g transform="translate(105, 64)">
                        <circle cx="0" cy="0" r="11" fill="#0f172a"/>
                        <circle cx="0" cy="0" r="7" fill="#cbd5e1"/>
                        <g class="spoke-group">
                            <line x1="-6" y1="0" x2="6" y2="0" stroke="#334155" stroke-width="2"/>
                            <line x1="0" y1="-6" x2="0" y2="6" stroke="#334155" stroke-width="2"/>
                        </g>
                        <circle cx="0" cy="0" r="2.5" fill="#0f172a"/>
                    </g>

                    <!-- Wheel 3 (Cabin Front) -->
                    <g transform="translate(170, 64)">
                        <circle cx="0" cy="0" r="11" fill="#0f172a"/>
                        <circle cx="0" cy="0" r="7" fill="#cbd5e1"/>
                        <g class="spoke-group">
                            <line x1="-6" y1="0" x2="6" y2="0" stroke="#334155" stroke-width="2"/>
                            <line x1="0" y1="-6" x2="0" y2="6" stroke="#334155" stroke-width="2"/>
                        </g>
                        <circle cx="0" cy="0" r="2.5" fill="#0f172a"/>
                    </g>
                </svg>
            </div>
        </div>
    </div>

</body>
</html>
